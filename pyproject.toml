[project]
name = "downloadany-backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "许佳豪", email = "10351874+xujiahao29@user.noreply.gitee.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "google-auth>=2.38.0",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.7.1",
    "pyjwt>=2.10.1",
    "pymysql>=1.1.1",
    "pwdlib[argon2]>=0.2.1",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.38",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
]

[project.scripts]
downloadany-backend = "downloadany_backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
